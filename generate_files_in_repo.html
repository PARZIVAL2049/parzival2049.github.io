<!DOCTYPE html>
<html>
<head>
  <title>reynep.github.io</title>
  <script src="https://cdn.jsdelivr.net/npm/github-api@3.3.0/dist/GitHub.bundle.min.js"></script>
  <style>
    body { font-family: Arial; margin: 20px; }
    a { color: #0366d6; text-decoration: none; }
    a:hover { text-decoration: underline; }
    li { margin: 5px 0; }
  </style>
</head>
<body>
  <h1>Files in Repository</h1>
  <ul id="file-list"></ul>

<script>
const repo = "REYNEP/reynep.github.io";
const list = document.getElementById("file-list");
const isLocal = window.location.protocol === 'file:';
const baseUrl = isLocal ? 'https://reynep.github.io/' : '/';

// List of directories to ignore (relative to repo root)
const ignoreList = [
  "fonts"       // reynep.github.io/fonts is ignored
];

// Recursive function to fetch files
async function fetchFiles(path = "") {
  try {
    const response = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`);
    const data = await response.json();

    for (const item of data) {
      // Skip ignored directories
      if (item.type === "dir" && !ignoreList.includes(item.path)) {
        await fetchFiles(item.path);
      } else if (
        item.type === "file" &&
        item.name.endsWith(".html") &&
        item.name !== "index.html"
      ) {
        const li = document.createElement("li");
        const a = document.createElement("a");

        // Remove .html and preserve folder structure
        const cleanName = item.path.replace(/\.html$/, "");
        a.href = baseUrl + cleanName;
        a.textContent = cleanName;

        const icon = document.createElement("span");
        icon.textContent = "📄 ";
        li.prepend(icon);
        li.appendChild(a);
        list.appendChild(li);
      }
    }
  } catch (error) {
    list.innerHTML = `<li>Error loading file list. Visit the <a href='https://github.com/${repo}'>GitHub repo</a> directly.</li>`;
    console.error("Fetch error:", error);
  }
}

// Start fetching from root
fetchFiles();
</script>



</body>
</html>
